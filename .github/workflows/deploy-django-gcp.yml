name: Deploy Django API to GCP VMs

on:
  push:
    branches:
      - main
    paths:
      - 'divisible_api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticates with Google Cloud using the service account key directly.
      # The previous step to create a temporary key file is no longer needed
      # as the 'credentials_json' input can directly accept the key content.
      # Authenticates with Google Cloud using Workload Identity Federation.
      # This is more secure than using a service account key.
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/754166336149/locations/global/workloadIdentityPools/github-actions-pool-new/providers/github-provider-new'
          service_account: 'githubact-prime-api@archejreterra.iam.gserviceaccount.com'
          audience: 'archejreterra'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get VM Instance Names and Zones
        id: get_vms
        run: |
          INSTANCES=$(gcloud compute instances list --filter="labels.goog-terraform-provisioned=true" --format="value(name,zone)")
          if [ -z "$INSTANCES" ]; then
            echo "No VMs found with the 'django-api' tag."
            exit 1
          fi
          echo "Found VMs:"
          echo "$INSTANCES"
          echo "instances<<EOF" >> $GITHUB_OUTPUT
          echo "$INSTANCES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Deploy to each VM
        env:
          INSTANCES: ${{ steps.get_vms.outputs.instances }}
          VM_USERNAME: ${{ secrets.GCP_VM_USERNAME }}
        run: |
          GUNICORN_SERVICE_NAME="gunicorn"
          REPO_DIR="/home/${VM_USERNAME}/api-prime"

          echo "--- Instances to deploy to ---"
          echo "${INSTANCES}"
          echo "------------------------------"

          while read -r INSTANCE_PAIR; do
            if [ -z "$INSTANCE_PAIR" ]; then
              continue
            fi
            INSTANCE_NAME=$(echo "$INSTANCE_PAIR" | cut -d',' -f1)
            INSTANCE_ZONE=$(echo "$INSTANCE_PAIR" | cut -d',' -f2)

            echo "--- Deploying to $INSTANCE_NAME in $INSTANCE_ZONE ---"

            gcloud compute ssh "${VM_USERNAME}@${INSTANCE_NAME}" \
              --zone="${INSTANCE_ZONE}" \
              --command="
                set -e
                echo 'Pulling latest changes...'
                cd $REPO_DIR
                git pull origin main
                echo 'Restarting Gunicorn service...'
                sudo systemctl restart $GUNICORN_SERVICE_NAME
                echo 'Deployment to $INSTANCE_NAME successful.'
              "
            if [ $? -ne 0 ]; then
              echo "Deployment failed on VM: $INSTANCE_NAME ($INSTANCE_ZONE)."
              exit 1
            fi
          done <<< "${INSTANCES}"